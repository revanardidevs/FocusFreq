name = "focusfreq-app"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = [
  "nodejs_compat",
  "global_fetch_strictly_public"
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
# Self-reference binding required by OpenNext for internal routing
binding = "WORKER_SELF_REFERENCE"
service = "focusfreq-app"

# Uncomment to enable ISR caching with R2 (not needed for free trial)
# [[r2_buckets]]
# binding = "NEXT_INC_CACHE_R2_BUCKET"
# bucket_name = "<YOUR_BUCKET_NAME>"
