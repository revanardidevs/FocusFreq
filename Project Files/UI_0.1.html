eturn with a clearer mind.</p><button id="breakBtn2">Start Short Break</button><div class="leaf">\u2618</div></section>\n      </section>\n      <section class="info"><div class="info-kicker">Focus better with FocusFreq</div><h1>An online Pomodoro timer with calming focus sounds and simple task tracking.</h1><p class="lead">FocusFreq helps you choose one task, start a focused work session, and stay with it using a clean timer, optional background sound, and lightweight progress tracking.</p><article class="article"><h2>What is FocusFreq?</h2><p>FocusFreq is a browser-based focus workspace built around the Pomodoro method. It combines a focus timer, short and long breaks, task context, session history, and optional focus sounds such as noise, tones, and custom frequencies.</p></article><article class="article"><h2>What is the Pomodoro Technique?</h2><p>The Pomodoro Technique breaks work into focused intervals separated by short breaks. A common setup is 25 minutes of focused work followed by a 5-minute break.</p></article><article class="article"><h2>How to use FocusFreq</h2><ol><li>Add or select one task.</li><li>Choose Focus, Short Break, or Long Break.</li><li>Pick an optional focus sound.</li><li>Start the timer and keep the workspace minimal.</li></ol></article><article class="article"><h2>Core features</h2><div class="features"><div class="feature"><strong>Pomodoro cycle</strong><span>Customize focus, break, and interval settings.</span></div><div class="feature"><strong>Task context</strong><span>Keep one active task visible.</span></div><div class="feature"><strong>Focus Sound</strong><span>Use noise, tones, custom frequencies, or silent mode.</span></div><div class="feature"><strong>Session history</strong><span>Track completed focus time and sessions.</span></div></div></article></section>\n    </main>\n  </div>\n</div>\n<script>\nconst $=id=>document.getElementById(id);\nconst st={mode:\'focus\',pomodoro:25,short:5,long:15,remaining:1500,total:1500,status:    <h2>Leaderboard table</h2>\n                </div>\n              </div>\n\n              <div class="privacy-strip">\n                \ud83d\udd12 Ranked by completed focus minutes. Task titles stay private. Top Sound is aggregate usage only.\n                Rank movement is shown beside each name.\n              </div>\n\n              <div class="toolbar">\n                <div class="filters">\n                  <button class="filter active" data-period="week">Weekly</button>\n                  <button class="filter" data-period="month">Monthly</button>\n                  <button class="filter" data-period="all">All time</button>\n                </div>\n\n                <div class="tools">\n                  <input class="search" id="searchInput" placeholder="Search names..."/>\n                  <select class="select" id="metricSelect">\n                    <option value="focusMinutes">Focus time</option>\n                    <option value="sessions">Sessions</option>\n                    <option value="streak">Streak</option>\n                  </select>\n                  <button class="btn" id="clearBtn">Clear</button>\n                </div>\n              </div>\n\n              <div class="empty" id="emptyState">\n                <h3>No users found</h3>\n                <p>Try another search or period.</p>\n              </div>\n\n              <div class="leaderboard" id="leaderboardList"></div>\n            </section>\n          </div>\n\n          <aside class="side">\n            <section class="card rank-card">\n              <div class="eyebrow">Next move</div>\n              <h3>4 Pomodoros to #2</h3>\n              <p>Sarah is 80 minutes ahead. Complete focused sessions today to close the gap.</p>\n\n              <div class="progress-wrap">\n                <div class="progress-label">\n                  <span>Progress to next rank</span>\n                  <strong>68%</strong>\n                </div>\n                <div class="progress"><span></span></div>\n              </div>\n            </section>\n\n            <section class="card insight">\n              <div class="eyebrow">Frequency insight</div>\n              <h3>Your best sound</h3>\n              <p><strong>Brown Noise</strong> appears in your longest completed sessions this week. Sound is shown as an aggregate pattern only, not as private task/session detail.</p>\n              <button class="btn" style="width:100%;margin-top:14px" id="howItWorksBtn">How scoring works</button>\n            </section>\n\n            <section class="card popular-card">\n              <div class="eyebrow">Popular Sound</div>\n              <h3>Top sounds this week</h3>\n\n              <div class="popular-list">\n                <div class="popular-item">\n                  <div class="popular-icon">\u2248</div>\n                  <div>\n                    <strong>Brown Noise</strong>\n                    <span>Used in 42% of completed focus time</span>\n                  </div>\n                  <div class="popular-value">#1</div>\n                </div>\n\n                <div class="popular-item">\n                  <div class="popular-icon">\u223f</div>\n                  <div>\n                    <strong>432 Hz</strong>\n                    <span>Popular for long deep work sessions</span>\n                  </div>\n                  <div class="popular-value">#2</div>\n                </div>\n\n                <div class="popular-item">\n                  <div class="popular-icon">\u25d0</div>\n                  <div>\n                    <strong>Pink Noise</strong>\n                    <span>Often used for writing and review</span>\n                  </div>\n                  <div class="popular-value">#3</div>\n                </div>\n              </div>\n\n              <p class="mini-note">Sound rankings are aggregate patterns only. They do not affect leaderboard score.</p>\n            </section>\n\n            <section class="card popular-card">\n              <div class="eyebrow">Popular Pomodoro</div>\n              <h3>Most used focus lengths</h3>\n\n              <div class="popular-list">\n                <div class="popular-item">\n                  <div class="popular-icon focus">25</div>\n                  <div>\n                    <strong>25 min Pomodoro</strong>\n                    <span>Most completed session length</span>\n                  </div>\n                  <div class="popular-value focus">58%</div>\n                </div>\n\n                <div class="popular-item">\n                  <div class="popular-icon focus">50</div>\n                  <div>\n                    <strong>50 min Deep Work</strong>\n                    <span>Best for top 10% focusers</span>\n                  </div>\n                  <div class="popular-value focus">27%</div>\n                </div>\n\n                <div class="popular-item">\n                  <div class="popular-icon focus">90</div>\n                  <div>\n                    <strong>90 min Long Flow</strong>\n                    <span>Less common, highest average output</span>\n                  </div>\n                  <div class="popular-value focus">9%</div>\n                </div>\n              </div>\n\n              <p class="mini-note">This helps users discover which session lengths the community actually completes.</p>\n            </section>\n\n\n          </aside>\n        </section>\n      </div>\n    </main>\n  </div>\n</div>\n\n<div class="toast" id="toast">Done</div>\n\n<script>\nconst users = {\n  week: [\n    {rank:1,name:\'Alex\',handle:\'@deepworkalex\',focusMinutes:765,sessions:24,streak:8,change:\'+1\',you:false},\n    {rank:2,name:\'Sarah\',handle:\'@sarahfocus\',focusMinutes:560,sessions:18,streak:5,change:\'same\',you:false},\n    {rank:3,name:\'You\',handle:\'@you\',focusMinutes:440,sessions:14,streak:3,change:\'+2\',you:true},\n    {rank:4,name:\'Mike\',handle:\'@mikeflow\',focusMinutes:375,sessions:11,streak:2,change:\'-1\',you:false},\n    {rank:5,name:\'Emma\',handle:\'@emmadeep\',focusMinutes:340,sessions:10,streak:4,change:\'same\',you:false},\n    {rank:6,name:\'Nadia\',handle:\'@nadiawrites\',focusMinutes:290,sessions:9,streak:2,change:\'+3\',you:false}\n  ],\n  month: [\n    {rank:1,name:\'Sarah\',handle:\'@sarahfocus\',focusMinutes:2380,sessions:76,streak:11,change:\'+2\',you:false},\n    {rank:2,name:\'Alex\',handle:\'@deepworkalex\',focusMinutes:2240,sessions:70,streak:8,change:\'-1\',you:false},\n    {rank:3,name:\'Emma\',handle:\'@emmadeep\',focusMinutes:1990,sessions:61,streak:7,change:\'+1\',you:false},\n    {rank:4,name:\'You\',handle:\'@you\',focusMinutes:1740,sessions:54,streak:3,change:\'same\',you:true},\n    {rank:5,name:\'Nadia\',handle:\'@nadiawrites\',focusMinutes:1425,sessions:43,streak:2,change:\'+1\',you:false}\n  ],\n  all: [\n    {rank:1,name:\'Alex\',handle:\'@deepworkalex\',focusMinutes:18540,sessions:620,streak:8,change:\'same\',you:false},\n    {rank:2,name:\'Sarah\',handle:\'@sarahfocus\',focusMinutes:17200,sessions:588,streak:11,change:\'+1\',you:false},\n    {rank:3,name:\'Emma\',handle:\'@emmadeep\',focusMinutes:15110,sessions:502,streak:7,change:\'-1\',you:false},\n    {rank:4,name:\'You\',handle:\'@you\',focusMinutes:13240,sessions:430,streak:3,change:\'+2\',you:true},\n    {rank:5,name:\'Mike\',handle:\'@mikeflow\',focusMinutes:11005,sessions:360,streak:2,change:\'same\',you:false}\n  ]\n};\n\nlet period = \'week\';\nlet metric = \'focusMinutes\';\nlet query = \'\';\n\nconst $ = id => document.getElementById(id);\n\nfunction toast(text){\n  const el = $(\'toast\');\n  el.textContent = text;\n  el.classList.add(\'show\');\n  clearTimeout(toast.timer);\n  toast.timer = setTimeout(() => el.classList.remove(\'show\'), 1400);\n}\n\nfunction fm(minutes){\n  if(minutes < 60) return `${minutes}m`;\n  const h = Math.floor(minutes / 60);\n  const m = minutes % 60;\n  return m ? `${h}h ${m}m` : `${h}h`;\n}\n\nfunction initials(name){\n  return name === \'You\' ? \'Y\' : name.slice(0,1).toUpperCase();\n}\n\nfunction userSound(user){\n  const map = {\n    Alex:\'Brown Noise\',\n    Sarah:\'432 Hz\',\n    You:\'Brown Noise\',\n    Mike:\'No Audio\',\n    Emma:\'Pink Noise\',\n    Nadia:\'528 Hz\'\n  };\n  return map[user.name] || \'Brown Noise\';\n}\n\nfunction shiftIcon(change){\n  if(!change) return \'\';\n  if(change.startsWith(\'+\')){\n    return `<span class="shift up" title="Rank up ${change}">\u25b2</span>`;\n  }\n  return \'\';\n}\n\nfunction sortedUsers(){\n  return [...(users[period] || users.week)]\n    .filter(user => `${user.name} ${user.handle}`.toLowerCase().includes(query.toLowerCase()))\n    .sort((a,b) => b[metric] - a[metric]);\n}\n\nfunction renderPodium(){\n  const top = [...(users[period] || users.week)].sort((a,b) => a.rank - b.rank).slice(0,3);\n  const order = [top[1], top[0], top[2]].filter(Boolean);\n\n  $(\'podium\').innerHTML = order.map(user => `\n    <div class="podium-card ${user.rank === 1 ? \'first\' : user.rank === 2 ? \'second\' : \'third\'}">\n      <div class="medal">${user.rank === 1 ? \'\ud83e\udd47\' : user.rank === 2 ? \'\ud83e\udd48\' : \'\ud83e\udd49\'}</div>\n      <div class="avatar">${initials(user.name)}</div>\n      <h3>${user.name}</h3>\n      <p>${user.handle}</p>\n      <div class="podium-score">\n        <span class="podium-focus">${fm(user.focusMinutes)}</span>\n        <span class="podium-meta">${user.sessions} completed sessions</span>\n        <span class="sound-pill" style="margin-top:10px">${userSound(user)}</span>\n      </div>\n      ${user.you ? \'<span class="you-tag">You</span>\' : \'\'}\n    </div>\n  `).join(\'\');\n}\n\nfunction renderTable(){\n  const list = sortedUsers();\n  $(\'emptyState\').style.display = list.length ? \'none\' : \'block\';\n\n  $(\'leaderboardList\').innerHTML = `\n    <div class="lb-row header">\n      <div>Rank</div>\n      <div>Member</div>\n      <div>Focus</div>\n      <div>Top Sound</div>\n      <div>Sessions</div>\n      <div>Streak</div>\n    </div>\n  ` + list.map((user, index) => `\n    <div class="lb-row ${user.you ? \'you\' : \'\'}" data-name="${user.name}">\n      <div class="lb-rank">#${index + 1}</div>\n\n      <div class="lb-member">\n        <div class="mini-avatar">${initials(user.name)}</div>\n        <div class="member-meta">\n          <div class="name-line">\n            <span class="lb-name ${user.you ? \'you\' : \'\'}">${user.name}</span>\n            ${shiftIcon(user.change)}\n          </div>\n          <span class="handle">${user.handle}${user.you ? \' \u00b7 you\' : \'\'}</span>\n        </div>\n      </div>\n\n      <div class="score">${fm(user.focusMinutes)}</div>\n      <div><span class="sound-pill">${userSound(user)}</span></div>\n      <div class="muted">${user.sessions}</div>\n      <div class="muted">${user.streak}d</div>\n    </div>\n  `).join(\'\');\n\n  document.querySelectorAll(\'.lb-row[data-name]\').forEach(row => {\n    row.onclick = () => toast(`Open profile: ${row.dataset.name}`);\n  });\n}\n\nfunction render(){\n  renderPodium();\n  renderTable();\n}\n\ndocument.querySelectorAll(\'[data-period]\').forEach(button => {\n  button.onclick = () => {\n    document.querySelectorAll(\'[data-period]\').forEach(x => x.classList.remove(\'active\'));\n    button.classList.add(\'active\');\n    period = button.dataset.period;\n    render();\n    toast(`Period: ${button.textContent}`);\n  };\n});\n\n$(\'searchInput\').oninput = event => {\n  query = event.target.value;\n  renderTable();\n};\n\n$(\'metricSelect\').onchange = event => {\n  metric = event.target.value;\n  renderTable();\n  toast(`View metric: ${event.target.options[event.target.selectedIndex].text}`);\n};\n\n$(\'clearBtn\').onclick = () => {\n  query = \'\';\n  metric = \'focusMinutes\';\n  $(\'searchInput\').value = \'\';\n  $(\'metricSelect\').value = \'focusMinutes\';\n  render();\n  toast(\'Filters cleared\');\n};\n\n$(\'shareRankBtn\').onclick = () => toast(\'Rank copied for sharing\');\n$(\'privacyBtn\').onclick = () => toast(\'Only aggregate stats are public\');\n$(\'startFocusBtn\').onclick = () => toast(\'Mock navigation: /app focus page\');\n$(\'howItWorksBtn\').onclick = () => toast(\'Score = completed focus minutes; sound is insight only\');\n$(\'mobileMenuBtn\')?.addEventListener(\'click\', () => toast(\'Mock mobile menu opened\'));\n\ndocument.querySelectorAll(\'[data-nav]\').forEach(button => {\n  button.onclick = () => toast(`Mock navigation: ${button.dataset.nav}`);\n});\n\nrender();\n<\/script>\n\n<script>\n(function(){\n  document.addEventListener(\'click\', function(event){\n    var button = event.target.closest(\'[data-nav]\');\n    if (!button) return;\n    var page = button.getAttribute(\'data-nav\');\n    if (!page) return;\n    if (window.parent && window.parent !== window) {\n      event.preventDefault();\n      event.stopPropagation();\n      window.parent.postMessage({ type: \'focusfreq:navigate\', page: page }, \'*\');\n    }\n  }, true);\n})();\n<\/script>\n\n</body>\n</html>\n',
      };
      const frame = document.getElementById("appFrame");

      function loadPage(pageName) {
        const safePage = pages[pageName] ? pageName : "focus";
        frame.srcdoc = pages[safePage];

        try {
          localStorage.setItem("focusfreqSingleNavMockupPage", safePage);
        } catch (error) {}
      }

      window.addEventListener("message", function (event) {
        const data = event.data || {};
        if (data.type === "focusfreq:navigate") {
          loadPage(data.page);
        }
      });

      let initialPage = "focus";
      try {
        initialPage =
          localStorage.getItem("focusfreqSingleNavMockupPage") || "focus";
      } catch (error) {}

      loadPage(initialPage);
    </script>
  </body>
